# Converge the whole lab. Terraform writes inventory/hosts.yml first.
- name: Base configuration for every lab node
  hosts: all
  become: true
  roles:
    - common

- name: Classic Slurm cluster
  hosts: slurm
  become: true
  roles:
    - munge
    - slurm_common

- name: Slurm controller (slurmctld + slurmdbd + MariaDB + NFS server)
  hosts: slurm_controller
  become: true
  roles:
    - slurm_controller

- name: Slurm compute nodes (slurmd + fake GPUs + NFS client)
  hosts: slurm_compute
  become: true
  roles:
    - slurm_compute

# --- Kubernetes (kubeadm). Groups are empty unless terraform enable_k8s=true. ---

- name: Kubernetes node prerequisites
  hosts: k8s
  become: true
  roles:
    - k8s_node

- name: Kubernetes control plane
  hosts: k8s_control_plane
  become: true
  roles:
    - k8s_control_plane

- name: Kubernetes workers
  hosts: k8s_workers
  become: true
  roles:
    - k8s_worker

- name: Kubernetes CNI (Cilium)
  hosts: k8s_control_plane
  become: true
  roles:
    - k8s_addons

# Argo CD + the root Application; Argo CD then syncs everything in gitops/.
# Needs its repo credentials first: scripts/register-argocd-repo.sh (one-time).
- name: Argo CD bootstrap
  hosts: k8s_control_plane
  become: true
  roles:
    - k8s_argocd
