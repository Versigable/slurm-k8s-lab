- name: Install the node-triage MCP server
  ansible.builtin.copy:
    src: "{{ node_triage_binary }}"
    dest: /usr/local/bin/node-triage
    owner: root
    group: root
    mode: "0755"

# Changing node state (drain/resume) through slurmctld needs Slurm's Admin
# level. Operator is NOT enough: it covers accounting objects and reservations,
# and `scontrol update nodename=...` fails with "Invalid user id" (verified on
# this cluster). Admin is still narrower than sudo/root, and the MCP server only
# exposes drain and resume, only with -allow-writes.
- name: Read the triage user's Slurm admin level
  ansible.builtin.command: sacctmgr -n -P show user {{ node_triage_user }} format=adminlevel
  register: node_triage_adminlevel
  changed_when: false

- name: Make the triage user a Slurm Admin
  ansible.builtin.command: sacctmgr -i modify user {{ node_triage_user }} set adminlevel=Admin
  when: node_triage_adminlevel.stdout | trim != 'Administrator'
  changed_when: true

# --- Kubernetes access (only when the lab has a K8s cluster) ---------------------------
# The ServiceAccount, RBAC and token Secret come from gitops/node-triage (Argo CD).
# Copy the API URL, CA and token to /etc/node-triage, where the server finds them
# by default. The token only passes through Ansible memory.
- name: Kubernetes access for node-triage
  when: groups['k8s_control_plane'] | default([]) | length > 0
  block:
    - name: Read the node-triage ServiceAccount token and cluster CA
      ansible.builtin.command: >
        kubectl -n kube-system get secret node-triage-token -o jsonpath='{.data}'
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      register: node_triage_k8s_secret
      changed_when: false
      no_log: true

    - name: Stop if Argo CD hasn't created the token yet
      ansible.builtin.fail:
        msg: "kube-system/node-triage-token is missing or empty; is the node-triage Argo CD app synced?"
      when: >-
        node_triage_k8s_secret.stdout | length == 0 or
        (node_triage_k8s_secret.stdout | from_json).token | default('') | length == 0

    - name: Config directory
      ansible.builtin.file:
        path: /etc/node-triage
        state: directory
        owner: root
        group: "{{ node_triage_user }}"
        mode: "0750"

    - name: API server URL
      ansible.builtin.copy:
        dest: /etc/node-triage/api-url
        content: "https://{{ hostvars[groups['k8s_control_plane'][0]].ansible_host }}:6443\n"
        owner: root
        group: "{{ node_triage_user }}"
        mode: "0640"

    - name: Cluster CA certificate
      ansible.builtin.copy:
        dest: /etc/node-triage/ca.crt
        content: "{{ (node_triage_k8s_secret.stdout | from_json)['ca.crt'] | b64decode }}"
        owner: root
        group: "{{ node_triage_user }}"
        mode: "0640"

    - name: ServiceAccount token
      ansible.builtin.copy:
        dest: /etc/node-triage/token
        content: "{{ (node_triage_k8s_secret.stdout | from_json).token | b64decode }}"
        owner: root
        group: "{{ node_triage_user }}"
        mode: "0640"
      no_log: true

# --- Slinky (Slurm on Kubernetes) through slurmrestd --------------------------------
# Two Slurm JWTs, minted by slurmctld itself (`scontrol token`):
#   token-read  for user nobody: reads nodes/jobs, can't change anything
#               (verified: a drain as nobody gets "Invalid user id");
#   token-admin for the SlurmUser, used only by drain/resume. Slinky runs
#               without accounting, so Slurm has no admin levels to grant.
# Re-minted when either has under 7 days left; they only pass through Ansible memory.
- name: Slinky access for node-triage
  when: groups['k8s_control_plane'] | default([]) | length > 0
  block:
    - name: Is there a Slinky cluster?
      ansible.builtin.command: kubectl -n slurm get pod slurm-controller-0 -o name
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      register: node_triage_slinky_present
      changed_when: false
      failed_when: false

    - name: Configure Slinky access
      when: node_triage_slinky_present.rc == 0
      block:
        - name: Read the slurmrestd LoadBalancer IP
          ansible.builtin.command: kubectl -n slurm get svc slurm-restapi -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"
          environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
          register: node_triage_slinky_ip
          changed_when: false
          failed_when: node_triage_slinky_ip.stdout | length == 0

        - name: Slinky config directory
          ansible.builtin.file:
            path: /etc/node-triage/slinky
            state: directory
            owner: root
            group: "{{ node_triage_user }}"
            mode: "0750"

        - name: Write the slurmrestd URL
          ansible.builtin.copy:
            dest: /etc/node-triage/slinky/url
            content: "http://{{ node_triage_slinky_ip.stdout }}:6820\n"
            owner: root
            group: "{{ node_triage_user }}"
            mode: "0640"

        - name: Days left on the current tokens (-1 if missing)
          ansible.builtin.shell: |
            set -o pipefail
            python3 - <<'PY'
            import base64, json, os, time
            days = []
            for f in ("token-read", "token-admin"):
                p = "/etc/node-triage/slinky/" + f
                try:
                    payload = open(p).read().strip().split(".")[1]
                    exp = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))["exp"]
                    days.append((exp - time.time()) / 86400)
                except Exception:
                    days.append(-1)
            print(int(min(days)))
            PY
          args:
            executable: /bin/bash
          register: node_triage_slinky_days
          changed_when: false

        - name: Mint Slinky tokens (30 days)
          ansible.builtin.command: >
            kubectl -n slurm exec slurm-controller-0 -c slurmctld --
            scontrol token username={{ item }} lifespan=2592000
          delegate_to: "{{ groups['k8s_control_plane'][0] }}"
          environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
          loop: [nobody, slurm]
          register: node_triage_slinky_tokens
          when: node_triage_slinky_days.stdout | int < 7
          # slurmctld may still be starting right after a rebuild.
          until: node_triage_slinky_tokens.rc == 0
          retries: 12
          delay: 10
          changed_when: true
          no_log: true

        - name: Install Slinky tokens
          ansible.builtin.copy:
            dest: "/etc/node-triage/slinky/{{ item.0 }}"
            content: "{{ item.1.stdout | regex_replace('^SLURM_JWT=', '') | trim }}\n"
            owner: root
            group: "{{ node_triage_user }}"
            mode: "0640"
          loop: "{{ ['token-read', 'token-admin'] | zip(node_triage_slinky_tokens.results) | list }}"
          when: node_triage_slinky_days.stdout | int < 7
          no_log: true

- name: Smoke-test the binary
  ansible.builtin.command: /usr/local/bin/node-triage -version
  changed_when: false
