# Runs on the control plane as root against /etc/kubernetes/admin.conf.
- name: Create add-on manifests directory
  ansible.builtin.file:
    path: /etc/kubernetes/addons
    state: directory
    owner: root
    group: root
    mode: "0700"

# --- Cilium ------------------------------------------------------------------------
- name: Write Cilium values
  ansible.builtin.template:
    src: cilium-values.yaml.j2
    dest: /etc/kubernetes/addons/cilium-values.yaml
    owner: root
    group: root
    mode: "0600"
  register: k8s_addons_cilium_values

- name: Read the installed Cilium chart
  ansible.builtin.command: helm list -n kube-system -f '^cilium$' -o json
  environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
  register: k8s_addons_cilium_release
  changed_when: false

# Only (re)install when the chart version or the values changed, so reruns are no-ops.
- name: Install or upgrade Cilium
  ansible.builtin.command: >
    helm upgrade --install cilium cilium --repo https://helm.cilium.io
    --version {{ cilium_version }} --namespace kube-system
    --values /etc/kubernetes/addons/cilium-values.yaml --wait --timeout 10m
  environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
  when: >-
    k8s_addons_cilium_values.changed or
    (k8s_addons_cilium_release.stdout | from_json | selectattr('status', 'equalto', 'deployed')
     | map(attribute='chart') | list) != ['cilium-' ~ cilium_version]
  changed_when: true

- name: All nodes Ready (they stay NotReady until the CNI is up)
  ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
  environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
  changed_when: false

# --- LoadBalancer IPs on the LAN ----------------------------------------------------------
- name: Write LB IP pool and L2 announcement policy
  ansible.builtin.template:
    src: lb-pool.yaml.j2
    dest: /etc/kubernetes/addons/lb-pool.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply LB IP pool and L2 policy
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/addons/lb-pool.yaml
  environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
  register: k8s_addons_lb_apply
  changed_when: k8s_addons_lb_apply.stdout_lines | reject('search', 'unchanged') | list | length > 0

# --- Storage ---------------------------------------------------------------------------
- name: Install local-path-provisioner (node-local PVs)
  ansible.builtin.command: >
    kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_version }}/deploy/local-path-storage.yaml
  environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
  register: k8s_addons_local_path
  changed_when: k8s_addons_local_path.stdout_lines | reject('search', 'unchanged') | list | length > 0

- name: Make local-path the default StorageClass
  ansible.builtin.command: >
    kubectl patch storageclass local-path
    -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
  register: k8s_addons_default_sc
  changed_when: "'no change' not in k8s_addons_default_sc.stdout"
