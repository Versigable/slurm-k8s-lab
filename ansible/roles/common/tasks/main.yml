# On a fresh clone, cloud-init is still refreshing apt lists when SSH comes up;
# apt calls made during that window fail with "No package matching ...".
# rc 2 = done with recoverable errors: Proxmox's generated user-data uses the
# deprecated string form of 'user', which cloud-init reports as a DEPRECATED warning.
- name: Wait for first-boot cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  register: common_cloud_init
  changed_when: false
  failed_when: common_cloud_init.rc not in [0, 2]

- name: Hostname matches the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Every lab node resolves every other lab node
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} slurm-k8s-lab (ansible)"
    block: |
      {% for h in groups['all'] | sort %}
      {{ hostvars[h].ansible_host }} {{ h }}
      {% endfor %}

- name: Read current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: common_current_tz
  changed_when: false

- name: Set timezone
  ansible.builtin.command: timedatectl set-timezone {{ lab_timezone }}
  when: common_current_tz.stdout != lab_timezone
  changed_when: true

- name: Base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    update_cache: true
    cache_valid_time: 3600

- name: Time sync (munge and Slurm credentials fail on clock skew)
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
