# Installs Argo CD itself. The root Application is applied separately by
# gitops-bootstrap.yml, after the one-time secrets exist (see scripts/).
- name: Write Argo CD values
  ansible.builtin.template:
    src: argocd-values.yaml.j2
    dest: /etc/kubernetes/addons/argocd-values.yaml
    owner: root
    group: root
    mode: "0600"
  register: k8s_argocd_values

- name: Read the installed Argo CD chart
  ansible.builtin.command: helm list -n {{ k8s_argocd_namespace }} -f '^argocd$' -o json
  environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
  register: k8s_argocd_release
  changed_when: false

- name: Install or upgrade Argo CD
  ansible.builtin.command: >
    helm upgrade --install argocd argo-cd --repo https://argoproj.github.io/argo-helm
    --version {{ k8s_argocd_chart_version }} --namespace {{ k8s_argocd_namespace }} --create-namespace
    --values /etc/kubernetes/addons/argocd-values.yaml --wait --timeout 10m
  environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
  when: >-
    k8s_argocd_values.changed or
    (k8s_argocd_release.stdout | from_json | selectattr('status', 'equalto', 'deployed')
     | map(attribute='chart') | list) != ['argo-cd-' ~ k8s_argocd_chart_version]
  changed_when: true
