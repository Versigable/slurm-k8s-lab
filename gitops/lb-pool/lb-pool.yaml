# LoadBalancer IPs, announced on the LAN by Cilium (ARP). Reserved outside
# X-Mansion DHCP (confirmed 2026-09-24).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
  labels:
    slurm-k8s-lab/owner: gitops
spec:
  blocks:
    - start: "10.0.5.140"
      stop: "10.0.5.149"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
  labels:
    slurm-k8s-lab/owner: gitops
spec:
  # Answer ARP for LoadBalancer/external IPs on the node's LAN NIC.
  interfaces:
    - ^(eth|en)[a-z0-9]+
  loadBalancerIPs: true
  externalIPs: true
