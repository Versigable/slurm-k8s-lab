apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner
  namespace: argocd
spec:
  project: default
  source:
    # Runner major.minor tracks the GitLab server (18.8); chart 0.85.0 ships runner 18.8.0.
    repoURL: https://charts.gitlab.io
    chart: gitlab-runner
    targetRevision: 0.85.0
    helm:
      releaseName: gitlab-runner
      valuesObject:
        # LAN address: job polling and git clones must not go through the Cloudflare tunnel.
        gitlabUrl: http://10.0.1.13:8081/
        concurrent: 4
        checkInterval: 10
        rbac:
          create: true
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        runners:
          # Holds runner-token (glrt-...). Created by scripts/register-runner.sh, never in git.
          secret: gitlab-runner-token
          config: |
            [[runners]]
              clone_url = "http://10.0.1.13:8081"
              [runners.kubernetes]
                namespace = "gitlab-ci"
                image = "alpine:3.22"
                cpu_request = "200m"
                memory_request = "256Mi"
                memory_limit = "2Gi"
                helper_cpu_request = "50m"
                helper_memory_request = "64Mi"
                service_cpu_request = "50m"
                service_memory_request = "64Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab-ci
  syncPolicy:
    automated: {prune: true, selfHeal: true}
