apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slurm-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/slinkyproject/charts
    chart: slurm-operator
    targetRevision: 1.2.2
    helm:
      releaseName: slurm-operator
      valuesObject:
        crds:
          enabled: false        # owned by the slurm-operator-crds app
        certManager:
          enabled: true
        # When a Kubernetes node is cordoned, the operator drains the Slurm node
        # whose pod runs there. These conditions don't trigger that; they supply
        # the Slurm drain *reason* ("(Reason: Message)" for each one that is True).
        # Both come from node-problem-detector, so cordoning a node for a kernel
        # fault puts the fault itself on the Slurm side. Verified 2026-09-26:
        # cordon k8s-w1 -> slinky-0 drained in 1 s with
        # "(FilesystemIsReadOnly: EXT4-fs (vda1): Remounting filesystem read-only)".
        propagatedNodeConditions:
          - ReadonlyFilesystem
          - KernelDeadlock
  destination:
    server: https://kubernetes.default.svc
    namespace: slinky
  # cert-manager's CA injector writes the webhooks' caBundle at runtime;
  # don't treat that as drift (selfHeal would fight it).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # cert-manager CRDs may not exist yet
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
