apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-problem-detector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://10.0.1.13:8081/agent-dev/slurm-k8s-lab.git
    targetRevision: main
    path: gitops/node-problem-detector
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      # The PodMonitor CRD comes from kube-prometheus-stack; don't fail the
      # dry run if this app syncs first. Retry until the CRD exists.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
