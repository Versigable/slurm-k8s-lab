# Slurm running on Kubernetes (Slinky). Compare with the classic VM cluster:
# same Slurm, but slurmctld/slurmd/slurmrestd are pods the operator reconciles.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slurm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/slinkyproject/charts
    chart: slurm
    targetRevision: 1.2.2
    helm:
      releaseName: slurm
      valuesObject:
        clusterName: slinky
        # The chart would generate these with lookup + randAscii on immutable
        # Secrets; Argo CD renders without lookup, so every sync would mint a
        # new key (and fail on the immutable Secret). Created once, out of band,
        # by scripts/create-slurm-auth.sh.
        slurmKey:
          create: false
          secretRef: {name: slurm-auth-slurm, key: slurm.key}
        jwtKey:
          create: false
          secretRef: {name: slurm-auth-jwt, key: jwt.key}
        controller:
          persistence:
            enabled: true      # default StorageClass (local-path)
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          slurmctld:
            resources:
              requests: {cpu: 100m, memory: 256Mi}
        restapi:
          replicas: 1          # the operator drives Slurm through slurmrestd
          # LAN IP (Cilium pool) so node-triage on slurm-ctl can read this cluster.
          # Every request needs a Slurm JWT; see ansible/roles/node_triage.
          service:
            metadata:
              annotations:
                lbipam.cilium.io/ips: "10.0.5.142"   # pinned: stable across rebuilds
            spec:
              type: LoadBalancer
        nodesets:
          slinky:
            replicas: 2        # one slurmd pod per worker (anti-affinity by default)
            slurmd:
              resources:
                requests: {cpu: 200m, memory: 256Mi}
        partitions:
          all:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: slurm
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # Slinky CRDs may not exist yet
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
